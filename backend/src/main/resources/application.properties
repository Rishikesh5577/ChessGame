# Prefer host-provided PORT (Railway/Render/Fly), else SERVER_PORT, else 8000
server.port=${PORT:${SERVER_PORT:8000}}

# Required: set MONGODB_URI in backend/.env (local) or host environment (production)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.uuid-representation=standard

# Comma-separated frontend origins, no trailing slash
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:8001,http://127.0.0.1:8001}

# Comma-separated WebSocket origin patterns (* allowed for local/dev)
app.websocket.allowed-origin-patterns=${APP_WS_ALLOWED_ORIGIN_PATTERNS:*}

# Chess engine (Stockfish) used for games against the computer.
# Leave engine-path blank to auto-detect: PATH, /usr/games/stockfish, ./engine/stockfish.exe
app.bot.enabled=${APP_BOT_ENABLED:true}
app.bot.engine-path=${APP_BOT_ENGINE_PATH:}
app.bot.pool-size=${APP_BOT_POOL_SIZE:2}
app.bot.threads=${APP_BOT_THREADS:1}
app.bot.hash-mb=${APP_BOT_HASH_MB:64}

# Auto-match: alone in queue this long → Stockfish (Impossible)
app.matchmaking.timeout-ms=${APP_MATCHMAKING_TIMEOUT_MS:30000}
